openapi: 3.1.0

info:
  title: Freak Hub API
  version: 0.1.0
  description: |
    HTTP contract between the Next.js front end and the Go API.

    This file is the source of truth: the TypeScript types the web consumes are
    generated from it (`pnpm contracts:generate`). Change the contract here
    first, then implement it on both sides.

    Authentication is a Clerk session JWT in `Authorization: Bearer <token>`,
    which the API verifies against Clerk's JWKS. The only unauthenticated
    endpoints are the health check and the Clerk webhook, and the latter
    authenticates with a Svix signature instead.

    ## Errors

    Every error response, without exception, is served as
    `application/problem+json` and shaped like `#/components/schemas/Error`
    (Problem Details, RFC 9457 — see
    [ADR-0014](../../docs/decisions/0014-sistema-de-estados-y-errores.md)).
    `code` is the stable, machine-readable identifier to branch on; `message`
    duplicates `detail` and exists only for backward compatibility with
    clients that predate this envelope.

    Every response, success or error, carries an `X-Request-ID` header — an
    opaque correlation id, also echoed in an error body's `correlation_id`.
    Include it when reporting an issue: it is what ties a response back to
    its server-side log line.

    Any endpoint below `/v1` and the webhook can also answer:

    - `405 Method Not Allowed` (`method_not_allowed`) for a verb the route
      does not support. Not repeated on every operation below — it applies
      uniformly.
    - `500 Internal Server Error` (`internal_error`) for a failure on our
      side. The detail is always generic; the real cause only ever reaches
      the server log, keyed by `correlation_id`.
    - `503 Service Unavailable` (`upstream_unavailable`, retryable) when
      Clerk itself is rate limiting us or unreachable — every `/v1` route
      verifies the session against Clerk's JWKS before anything else runs.
    - `504 Gateway Timeout` (`request_timeout`, retryable) when a request
      does not finish inside the server's own deadline.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.freakhub.local
    description: Production (replace with the real host)

tags:
  - name: system
    description: Liveness and readiness
  - name: members
    description: The people inside Freak Hub
  - name: invitations
    description: The only door into the community
  - name: works
    description: The shared catalogue of things the group tracks
  - name: library
    description: Each member's own relationship with those works
  - name: webhooks
    description: Deliveries from Clerk

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /v1/me:
    get:
      operationId: getCurrentMember
      tags: [members]
      summary: The member behind the current session
      responses:
        "200":
          description: The authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

    patch:
      operationId: updateCurrentMember
      tags: [members]
      summary: Edit the current member's name and username
      description: |
        Every field is optional, but at least one must be present. The
        request talks to Clerk, never to Postgres directly: Clerk is the
        source of truth, and the `user.updated` webhook is what eventually
        persists the change locally. The response reflects the edit
        immediately even so, as an optimistic projection over the local row.

        Changing email or password is out of scope for this endpoint.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
      responses:
        "200":
          description: The member, with the requested fields already updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The body is not valid JSON or carries unknown fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The requested username is already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: The body carries no changes, or a field fails validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/me/avatar:
    post:
      operationId: uploadCurrentMemberAvatar
      tags: [members]
      summary: Replace the current member's profile image
      description: |
        The request talks to Clerk, never to Postgres directly: Clerk is the
        source of truth, and the `user.updated` webhook is what eventually
        persists the change locally. The response reflects the edit
        immediately even so, as an optimistic projection over the local row.

        The content type is sniffed from the uploaded bytes, never trusted
        from what the client declares. Limited to 5 MB; JPEG, PNG, WEBP and
        GIF only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The member, with the avatar already updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request carries no file, or the multipart body is malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The image is larger than 5 MB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The image is not JPEG, PNG, WEBP or GIF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: The group roster
      description: |
        Every member who has ever joined, ordered by member-since ascending
        (oldest first) and keyset-paginated per
        [ADR-0011](../../docs/decisions/0011-paginacion-por-cursor.md).
      parameters:
        - in: query
          name: limit
          description: Page size. Defaults to 25, must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          description: Opaque cursor returned as `next_cursor` by a previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the group roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "400":
          description: The limit or the cursor is not valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/invitations:
    get:
      operationId: listMyInvitations
      tags: [invitations]
      summary: Invitations sent by the current member
      description: |
        Every invitation the caller has sent, newest first and
        keyset-paginated per
        [ADR-0011](../../docs/decisions/0011-paginacion-por-cursor.md). It
        includes every status: an accepted invitation is still part of the
        trail of who invited whom.
      parameters:
        - in: query
          name: limit
          description: Page size. Defaults to 25, must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          description: Opaque cursor returned as `next_cursor` by a previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the caller's invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: The limit or the cursor is not valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite somebody
      description: |
        Any member can invite, with no quota. The API asks Clerk to send the
        email and records who invited whom.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: The invitation was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: The body is malformed or carries unknown fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An invitation is already pending, or the email is already a member
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: The email is not valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/invitations/group:
    get:
      operationId: listGroupInvitations
      tags: [invitations]
      summary: Every invitation the group has ever sent
      description: |
        Unlike `GET /v1/invitations`, which is scoped to the caller, this
        returns every invitation any member has sent, with who sent it, newest
        first and keyset-paginated per
        [ADR-0011](../../docs/decisions/0011-paginacion-por-cursor.md). It
        includes every status: the screen that shows pending guests can
        filter client-side, and a full trail is what lets two members notice
        they are about to invite the same address.
      parameters:
        - in: query
          name: limit
          description: Page size. Defaults to 25, must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          description: Opaque cursor returned as `next_cursor` by a previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the group's invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvitationPage"
        "400":
          description: The limit or the cursor is not valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/works:
    get:
      operationId: listWorks
      tags: [works]
      summary: Search the shared catalogue
      description: |
        The catalogue every member shares. A work is not owned by anybody: if
        two members track the same anime, both point at the same `Work`, and
        that overlap is what later makes matches and recommendations mean
        something.

        Newest first and keyset-paginated per
        [ADR-0011](../../docs/decisions/0011-paginacion-por-cursor.md). Both
        filters are optional and combine with an AND.

        A cursor is only valid for the filters that produced it. Carrying a
        `next_cursor` from one filter combination over to a different one
        walks a keyset that was never computed for it, so re-send the same
        `category` and `q` with every page, and start from no cursor
        whenever a filter changes.
      parameters:
        - in: query
          name: category
          description: Keep only works of this category.
          schema:
            $ref: "#/components/schemas/WorkCategory"
        - in: query
          name: q
          description: |
            Free-text search over the title. Matching is case- and
            accent-insensitive; an empty value is the same as not sending it.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          description: Page size. Defaults to 25, must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          description: Opaque cursor returned as `next_cursor` by a previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the shared catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        "400":
          description: |
            `invalid_limit` or `invalid_cursor` for the pagination
            parameters, or `invalid_filter` when `category` is not one of
            the declared values. A filter is never ignored silently: an
            unknown value is rejected rather than answered with the
            unfiltered list.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

    post:
      operationId: createWork
      tags: [works]
      summary: Add a work by hand
      description: |
        Manual entry for something no external catalogue lists. It is not a
        fallback: [catalogs.md](../../docs/catalogs.md) treats it as part of
        the design, because a homemade deck or an obscure game has to be
        recordable too.

        The created work is always `source: manual` with a `source_id` of
        `null` — importing from AniList, TMDB and the rest is a separate
        piece of work and this endpoint deliberately refuses to fake it, so
        neither field is accepted in the body.

        **There is no `409` here, and that is not an oversight.** Imported
        works are unique by `(source, source_id)`, but this endpoint only
        ever creates manual ones, whose `source_id` is null — so there is
        nothing to collide on. Two members can legitimately add different
        things under the same title, and deciding otherwise would reject
        honest entries to prevent a duplicate that costs little. Look first
        with `GET /v1/works?q=`; merging duplicates is out of scope.

        A work is never deleted, even if nobody keeps it in their library
        (domain rule 3): it is shared history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequest"
      responses:
        "201":
          description: The work was added to the shared catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "400":
          description: The body is malformed or carries unknown fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: A field fails validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/works/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkId"
    get:
      operationId: getWork
      tags: [works]
      summary: One work's record
      description: |
        The catalogue is shared, so any member can read any work. Whether the
        caller keeps it in their own library is a separate question, answered
        by `GET /v1/library`.
      responses:
        "200":
          description: The work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No work has that id — `work_not_found`. A path segment that is
            not a well-formed uuid answers the same way: from the caller's
            side both mean "there is nothing here".
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/library:
    get:
      operationId: listLibraryEntries
      tags: [library]
      summary: The caller's own library
      description: |
        Every work the caller has registered, whatever its status. There is
        no separate wishlist endpoint because the wishlist is not a separate
        thing: it is `status=wishlist`, and an entry moves through the
        lifecycle without changing collection or losing its history.

        Newest first and keyset-paginated per
        [ADR-0011](../../docs/decisions/0011-paginacion-por-cursor.md). Both
        filters are optional and combine with an AND.

        A cursor is only valid for the filters that produced it. Carrying a
        `next_cursor` from one filter combination over to a different one
        walks a keyset that was never computed for it, so re-send the same
        `status` and `category` with every page, and start from no cursor
        whenever a filter changes.

        Each entry carries its whole `Work` inline rather than just a
        `work_id`, so rendering a library list never needs a second round of
        requests to resolve titles and covers.
      parameters:
        - in: query
          name: status
          description: Keep only entries in this status.
          schema:
            $ref: "#/components/schemas/LibraryEntryStatus"
        - in: query
          name: category
          description: Keep only entries whose work belongs to this category.
          schema:
            $ref: "#/components/schemas/WorkCategory"
        - in: query
          name: limit
          description: Page size. Defaults to 25, must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          description: Opaque cursor returned as `next_cursor` by a previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the caller's library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntryPage"
        "400":
          description: |
            `invalid_limit` or `invalid_cursor` for the pagination
            parameters, or `invalid_filter` when `status` or `category` is
            not one of the declared values. A filter is never ignored
            silently: an unknown value is rejected rather than answered with
            the unfiltered list.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The session is valid but no member row exists yet, which happens
            while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

    post:
      operationId: createLibraryEntry
      tags: [library]
      summary: Add a work to the caller's library
      description: |
        The work has to exist in the shared catalogue first; add it with
        `POST /v1/works` when it does not.

        A member holds **at most one** entry per work (domain rule 1), so
        adding a work that is already there is a conflict, not a second row:
        `409 already_in_library`. Watching something again is progress on the
        entry that already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryEntryRequest"
      responses:
        "201":
          description: The entry was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "400":
          description: The body is malformed or carries unknown fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Either `work_id` names no work (`work_not_found`), or the session
            is valid but no member row exists yet (`unknown_identity`), which
            happens while the `user.created` webhook is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller already keeps that work — `already_in_library`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: |
            A domain rule rejects the body: `rating_not_allowed` when the
            body carries a rating and `status` is neither `completed` nor
            `dropped`, or `invalid_progress` when the progress does not fit
            the work's category. The state machine does not apply here —
            creating an entry is not a transition.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/library/{id}:
    parameters:
      - $ref: "#/components/parameters/LibraryEntryId"
    get:
      operationId: getLibraryEntry
      tags: [library]
      summary: One entry of the caller's library
      responses:
        "200":
          description: The entry, with its work inline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibraryEntryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

    patch:
      operationId: updateLibraryEntry
      tags: [library]
      summary: Update status, progress, rating, favourite, ownership or note
      description: |
        Every field is optional and only the ones present are touched. A
        field sent as `null` is cleared on purpose — that is how a rating, a
        note or a date is removed — which is why those properties are
        nullable here and merely absent means "leave as it is". A body with
        no fields at all changes nothing and answers `200` with the entry
        unchanged.

        **A stored rating survives a status change.** The rule that only
        `completed` and `dropped` can be rated applies to a rating *arriving
        in the request*, not to one already saved. A
        `PATCH {"status": "in_progress"}` on an entry rated 8 succeeds and
        keeps the 8. `completed → in_progress` is a rewatch, there is no
        rating history to restore from, and silently destroying a score
        because somebody revisited something would be data loss. Clearing a
        rating is something you ask for, by sending `"rating": null`.

        **And the rule is about a *change* of rating, not about the field
        being present.** `rating_not_allowed` is raised when the body carries
        a non-null `rating` that *differs from the stored one* and the
        resulting status is neither `completed` nor `dropped`. Sending back a
        rating identical to the one already saved asks for nothing and
        succeeds, whatever the status.

        Without that, a state is reachable but not re-affirmable: an entry
        that is `in_progress` and rated 8 — a perfectly ordinary entry, since
        a score survives a rewatch — would be refused its own representation
        handed straight back, and `PATCH` would not be idempotent with
        respect to the object this API just returned. The same reasoning
        makes a `status` equal to the stored one a no-op rather than an
        illegal transition: a client sending the whole object back is asking
        for nothing, and answering 422 to nothing is a trap, not a rule.

        Unlike creation, **a status change is a transition** and is checked
        against the state machine in
        [domain.md](../../docs/domain.md). A move the machine does not allow
        is `422 invalid_transition`.

        The work an entry points at never changes: pointing at a different
        work is a different entry. Delete this one and create the other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryEntryRequest"
      responses:
        "200":
          description: The entry after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "400":
          description: The body is malformed or carries unknown fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibraryEntryNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: |
            A domain rule rejects the body: `rating_not_allowed` when the
            body carries a rating that differs from the stored one and the
            resulting status is neither `completed` nor `dropped`,
            `invalid_progress` when the progress does not fit the work's
            category, or `invalid_transition` when the state machine does not
            allow the requested status change.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

    delete:
      operationId: deleteLibraryEntry
      tags: [library]
      summary: Take a work out of the caller's library
      description: |
        Removes the caller's relationship with the work. The `Work` itself
        stays in the shared catalogue: it is never deleted, even when nobody
        keeps it any more (domain rule 3).

        Deleting is idempotent from the caller's side only in the sense that
        a second attempt answers `404`: the entry is already gone.
      responses:
        "204":
          description: The entry is gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibraryEntryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /webhooks/clerk:
    post:
      operationId: receiveClerkWebhook
      tags: [webhooks]
      summary: Clerk event delivery
      description: |
        Authenticated with a Svix signature, never with a session. Handles
        `user.created`, `user.updated` and `user.deleted`; every other event is
        acknowledged and ignored. Deliveries are at-least-once, so the handler
        is idempotent.

        A `500` here is deliberate, not a bug: Clerk retries a `5xx` delivery,
        which is exactly what we want when the failure is ours (the database
        being down, for instance). Only the body shape changed with
        ADR-0014 — the retry semantics did not.
      security: []
      parameters:
        - in: header
          name: svix-id
          required: true
          schema: { type: string }
        - in: header
          name: svix-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: svix-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string }
                data: { type: object, additionalProperties: true }
      responses:
        "204":
          description: Processed, or deliberately ignored
        "400":
          description: The payload is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The Svix signature does not check out
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: The event is well formed but cannot be projected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token, obtained in the browser with `getToken()`.

  headers:
    RequestID:
      description: |
        The opaque correlation id for this request. Also present as
        `correlation_id` on an error body. Include it when reporting an
        issue.
      schema:
        type: string

  parameters:
    WorkId:
      in: path
      name: id
      required: true
      description: The work's identifier.
      schema:
        type: string
        format: uuid

    LibraryEntryId:
      in: path
      name: id
      required: true
      description: The library entry's identifier.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: The session is missing, malformed or expired
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

    PayloadTooLarge:
      description: The request body is larger than the endpoint accepts
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

    LibraryEntryNotFound:
      description: |
        `library_entry_not_found`: no entry with that id belongs to the
        caller.

        One code covers both "it does not exist" and "it is not yours", and
        that is the point. Answering `403` for somebody else's entry would
        confirm the entry exists, and whose library holds what is nobody
        else's business — so an entry belonging to another member is
        indistinguishable from one that was never there.

        `unknown_identity` also lands here, while the `user.created` webhook
        is still in flight.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: A failure on our side. The detail is always generic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

    ServiceUnavailable:
      description: Clerk is rate limiting us or unreachable. Retryable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          description: Present when the delay before retrying is known.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

    Timeout:
      description: The request did not finish inside the server's deadline. Retryable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: |
        The single error envelope of the whole API (ADR-0014), served as
        `application/problem+json` and shaped after Problem Details (RFC
        9457). Branch on `code`, never on `title` or `detail`, which are
        human prose and may be reworded at any time. `message` duplicates
        `detail` and is deprecated: it exists only so a client written before
        ADR-0014 keeps working unmodified.
      required: [type, title, status, code, message, correlation_id]
      properties:
        type:
          type: string
          description: A URI identifying the problem type, `urn:freak-hub:problem:<code>`.
          examples: ["urn:freak-hub:problem:invitation_already_sent"]
        title:
          type: string
          description: A short, human-readable summary that does not change between occurrences of the same code.
        status:
          type: integer
          description: The HTTP status of this response, repeated in the body per RFC 9457.
        detail:
          type: string
          description: Prose specific to this occurrence, in Spanish.
        instance:
          type: string
          description: The request path that produced this error (never the query string).
        code:
          type: string
          description: |
            The stable, machine-readable identifier. This is what a client
            branches on. internal/api's contract parity test fails the build
            if this enum and the Go registry (httpx.Codes) ever disagree.
          examples: [invitation_already_sent, invalid_token, not_found]
          enum:
            - missing_token
            - invalid_token
            - unauthorized
            - unknown_identity
            - invalid_payload
            - not_found
            - internal_error
            - invalid_limit
            - invalid_cursor
            - invalid_filter
            - no_profile_changes
            - name_too_long
            - username_invalid_length
            - username_numeric_only
            - username_taken
            - avatar_too_large
            - avatar_unsupported_type
            - invalid_email
            - invitation_already_sent
            - already_member
            - already_in_library
            - work_not_found
            - rating_not_allowed
            - invalid_progress
            - library_entry_not_found
            - invalid_transition
            - method_not_allowed
            - payload_too_large
            - request_timeout
            - upstream_unavailable
        message:
          type: string
          deprecated: true
          description: Same text as `detail`. Kept only for backward compatibility with clients written before ADR-0014.
        correlation_id:
          type: string
          description: Opaque request identifier, also returned on the `X-Request-ID` header. Include it when reporting an issue.
        retryable:
          type: boolean
          description: Whether retrying the exact same request has a reasonable chance of succeeding (429, 502, 503, 504-shaped conditions).
        retry_after:
          type: integer
          description: Suggested delay in seconds before retrying. Present only when `retryable` is true and the delay is actually known.
        field_errors:
          type: array
          description: Present only when the error unambiguously blames one or more request fields.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string

    Member:
      type: object
      required: [id, clerk_user_id, username, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        clerk_user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        created_at:
          description: When this member joined ("member since").
          type: string
          format: date-time

    MemberPage:
      type: object
      description: |
        A keyset-paginated page (ADR-0011). `next_cursor` is `null` when
        nothing more remains to read.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          type: [string, "null"]

    Invitation:
      type: object
      required: [id, email, status, inviter_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked]
        inviter_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    InvitationPage:
      type: object
      description: |
        A keyset-paginated page (ADR-0011). `next_cursor` is `null` when
        nothing more remains to read.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        next_cursor:
          type: [string, "null"]

    InvitationInviter:
      type: object
      description: The public identity of the member who sent an invitation.
      required: [id, username, display_name]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri

    GroupInvitation:
      type: object
      description: |
        An invitation as seen from the group's perspective: who was invited,
        by whom, and where it stands.
      required: [id, email, status, created_at, inviter]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked]
        created_at:
          type: string
          format: date-time
        inviter:
          $ref: "#/components/schemas/InvitationInviter"

    GroupInvitationPage:
      type: object
      description: |
        A keyset-paginated page (ADR-0011). `next_cursor` is `null` when
        nothing more remains to read.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupInvitation"
        next_cursor:
          type: [string, "null"]

    WorkCategory:
      type: string
      description: |
        What kind of thing a work is. All six are declared because the set
        belongs to the domain, not to the release schedule
        ([domain.md](../../docs/domain.md)); the product only feeds `anime`
        for now, and the rest arrive as their categories are built.
      enum:
        - anime
        - manga
        - game
        - film
        - boardgame
        - tcg

    WorkSource:
      type: string
      description: |
        Where a work's record came from ([catalogs.md](../../docs/catalogs.md)).
        `manual` means somebody typed it in because no public catalogue lists
        it, and it is the only value `POST /v1/works` produces today.
      enum:
        - anilist
        - tmdb
        - igdb
        - bgg
        - scryfall
        - manual

    WorkMetadata:
      type: object
      description: |
        Everything that is specific to one category, kept out of the columns
        that apply to all of them: the rule in
        [domain.md](../../docs/domain.md) is that a field shared by every
        category is a column and a field that belongs to one lives here.

        The object is deliberately open. Anime — the only category the
        product feeds right now — uses these keys:

        | Key | Type | Meaning |
        | :--- | :--- | :--- |
        | `episodes` | integer | How many episodes the run has, when the catalogue knows |
        | `season` | string | The broadcast season, as the catalogue labels it (`"2024-spring"`) |
        | `status_airing` | string | The airing status the catalogue reports (`"airing"`, `"finished"`, `"not_yet_aired"`) |

        The other five categories will document their own keys when they are
        built. Closing this object now would mean inventing fields for board
        games and TCGs that nobody has used yet, so it stays open on purpose.
      additionalProperties: true
      properties:
        episodes:
          type: integer
          minimum: 0
          description: Anime only. Episode count, when the catalogue knows it.
        season:
          type: string
          description: Anime only. The broadcast season as the catalogue labels it.
        status_airing:
          type: string
          description: Anime only. The airing status the catalogue reports.

    Work:
      type: object
      description: |
        The objective record of a thing: title, category, year, cover,
        synopsis. It is **shared by the whole group**, which is what makes
        matches and recommendations mean anything later.

        That sharing rests on **import**, not on manual entry. A work that
        came from an external catalogue is unique by `(source, source_id)`
        while `source_id` is not null, so two members importing the same
        anime land on this same record.

        **Manual works are not deduplicated.** `source_id` is null by
        definition, and two people can legitimately add different things
        under the same title. What prevents an accidental duplicate is the
        search step: `GET /v1/works?q=` exists so you can look before you
        create. Merging duplicates is out of scope for now.

        A work is never deleted, even when nobody keeps it in their library
        any more (domain rule 3).
      required:
        - id
        - title
        - category
        - source
        - source_id
        - cover_url
        - synopsis
        - year
        - metadata
        - expansion_of
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: "#/components/schemas/WorkCategory"
        source:
          $ref: "#/components/schemas/WorkSource"
        source_id:
          type: [string, "null"]
          description: |
            The work's identifier inside `source`'s own catalogue. Always
            `null` when `source` is `manual`, because there is no external
            record to point at.
        cover_url:
          type: [string, "null"]
          format: uri
        synopsis:
          type: [string, "null"]
          maxLength: 5000
        year:
          type: [integer, "null"]
          description: Year of release, when it is known.
        metadata:
          $ref: "#/components/schemas/WorkMetadata"
        expansion_of:
          type: [string, "null"]
          format: uuid
          description: |
            The base game this work expands, for board game expansions
            ([ADR-0006](../../docs/decisions/0006-expansiones-de-juegos-de-mesa.md)).
            An expansion is a work of its own — its own record, its own
            library entry — linked to its base instead of floating loose in
            the catalogue. `null` for everything else, which today is
            everything.
        created_at:
          type: string
          format: date-time
          description: |
            When the work entered the shared catalogue. This is the key
            `GET /v1/works` orders by (ADR-0011), so a client can reproduce
            and display the order it is being served.
        updated_at:
          type: string
          format: date-time
          description: |
            When the record last changed. A `Work` travels embedded in every
            `LibraryEntry`, so this is what tells a client whether the copy
            it is holding has gone stale.

    WorkPage:
      type: object
      description: |
        A keyset-paginated page (ADR-0011). `next_cursor` is `null` when
        nothing more remains to read.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Work"
        next_cursor:
          type: [string, "null"]

    CreateWorkRequest:
      type: object
      description: |
        Manual entry of a work. Neither `source` nor `source_id` is accepted:
        what this endpoint creates is `manual` by definition, and pretending
        otherwise would let a client claim a record came from AniList when
        nobody checked.

        `expansion_of` is not accepted either. Linking an expansion to its
        base game needs validation rules that only matter once board games
        are actually built, and this release feeds anime.
      additionalProperties: false
      required: [title, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        category:
          $ref: "#/components/schemas/WorkCategory"
        cover_url:
          type: [string, "null"]
          format: uri
        synopsis:
          type: [string, "null"]
          maxLength: 5000
        year:
          type: [integer, "null"]
          minimum: 1800
          maximum: 2200
        metadata:
          $ref: "#/components/schemas/WorkMetadata"

    LibraryEntryStatus:
      type: string
      description: |
        Where a member stands with a work. The wishlist is not a separate
        list: it is this enum's `wishlist` value, which is what lets an entry
        travel from wanted to finished without changing collection or losing
        its history ([domain.md](../../docs/domain.md)).
      enum:
        - wishlist
        - pending
        - in_progress
        - completed
        - dropped
        - on_hold

    LibraryEntry:
      type: object
      description: |
        One member's relationship with one work — what turns a shared
        catalogue into *your* library. A member holds at most one entry per
        work (domain rule 1).

        The whole `Work` travels inline rather than a bare `work_id`: a
        library screen renders titles and covers straight from the page it
        already fetched, instead of firing one request per row.
      required:
        - id
        - work
        - status
        - progress
        - rating
        - is_favourite
        - owned
        - note
        - started_at
        - finished_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        work:
          $ref: "#/components/schemas/Work"
        status:
          $ref: "#/components/schemas/LibraryEntryStatus"
        progress:
          type: integer
          minimum: 0
          description: |
            How far along the member is. The unit depends on the work's
            category — episodes for anime, chapters for manga, hours for a
            game, plays for a board game — so the domain is what validates
            it, never the database (domain rule 5). `0` means not started.
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
          description: |
            A score from 1 to 10, only meaningful once there is an opinion.
            The domain accepts a rating *arriving in a request* on
            `completed` and `dropped` and rejects it anywhere else with
            `rating_not_allowed` (domain rule 2). A rating already stored
            survives a later status change — a rewatch does not erase a
            score.

            **In a `PATCH`**, what the rule guards is a *change*, so sending
            that same stored score back unchanged is a no-op and succeeds in
            any status. That clause does not carry over to creation: a
            `POST` has nothing stored for an incoming rating to match, so
            there the plain rule applies and
            `{"status": "in_progress", "rating": 8}` is
            `422 rating_not_allowed`. Creating cannot be idempotent with
            respect to something that does not exist yet.

            `null` when unrated.
        is_favourite:
          type: boolean
          description: |
            Affection, not score. A favourite rated 6 is a perfectly normal
            thing and the two fields never imply each other.
        owned:
          type: boolean
          description: Whether the member owns a physical copy. Matters for board games, manga and TCGs.
        note:
          type: [string, "null"]
          description: |
            A short note. It is **public** to the whole group, with no
            per-entry privacy setting
            ([ADR-0005](../../docs/decisions/0005-notas-publicas.md)).
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LibraryEntryPage:
      type: object
      description: |
        A keyset-paginated page (ADR-0011). `next_cursor` is `null` when
        nothing more remains to read.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryEntry"
        next_cursor:
          type: [string, "null"]

    CreateLibraryEntryRequest:
      type: object
      description: |
        `status` is required rather than defaulted, and **any of the six
        values is accepted**. Creating an entry is not a transition: it is
        the entry point into the lifecycle, so the state machine in
        [domain.md](../../docs/domain.md) does not constrain it. Registering
        an anime you finished years ago is an ordinary thing to do, and
        forcing it through `pending` plus a `PATCH` would be theatre.

        There is no default because there is nothing sensible to guess:
        wanting something, already owning it and having finished it are all
        equally normal ways to start.
      additionalProperties: false
      required: [work_id, status]
      properties:
        work_id:
          type: string
          format: uuid
          description: The work being added. It must already exist, or the answer is `404 work_not_found`.
        status:
          $ref: "#/components/schemas/LibraryEntryStatus"
        progress:
          type: integer
          minimum: 0
          description: Defaults to `0` when absent.
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
          description: Only accepted when `status` is `completed` or `dropped`; otherwise `422 rating_not_allowed`. Send `null` to leave it unrated.
        is_favourite:
          type: boolean
          description: Defaults to `false` when absent.
        owned:
          type: boolean
          description: Defaults to `false` when absent.
        note:
          type: [string, "null"]
          maxLength: 1000
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    UpdateLibraryEntryRequest:
      type: object
      description: |
        A partial update: only the properties present are touched. `null`
        clears a field on purpose — it is the only way to remove a rating, a
        note or a date — while an absent property leaves the stored value
        alone. A body with no properties at all is a no-op.

        `work_id` is absent by design: an entry never changes the work it
        points at.

        A `status` here is a **transition** and is checked against the state
        machine in [domain.md](../../docs/domain.md) — unlike creation,
        which is the entry point and accepts any of the six. Re-sending the
        status an entry already holds is a no-op, not an illegal move. A
        rating already stored is not touched by a status change, and
        re-sending that same rating is a no-op too; send `"rating": null` to
        clear it deliberately.
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/LibraryEntryStatus"
        progress:
          type: integer
          minimum: 0
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
          description: |
            Accepted when the resulting status is `completed` or `dropped`,
            and also when it is identical to the stored score, which changes
            nothing. A *different* rating on any other status is
            `422 rating_not_allowed`. Send `null` to clear it, which is
            always allowed.
        is_favourite:
          type: boolean
        owned:
          type: boolean
        note:
          type: [string, "null"]
          maxLength: 1000
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

security:
  - clerkSession: []
