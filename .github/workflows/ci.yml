name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  GO_VERSION: "1.26"

jobs:
  web:
    name: Web · lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Clerk inlines the publishable key at build time, so `next build` needs one
      # even though every page that uses it is dynamic. It is fabricated here
      # rather than written literally: a high-entropy string in the repo is
      # indistinguishable from a real leak, and silencing the scanner to make
      # room for it is how genuine leaks end up allowlisted later.
      - name: Fabricate a placeholder Clerk key
        run: |
          host="ci-placeholder.clerk.accounts.dev$"
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_$(printf '%s' "$host" | base64 | tr -d '=')" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  api:
    name: API · lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Verify go.mod is tidy
        working-directory: apps/api
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        working-directory: apps/api
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/api

      - name: Tests
        working-directory: apps/api
        run: go test -race -count=1 ./...

  contracts:
    name: Contracts · validate and check generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the OpenAPI description
        run: pnpm --filter @freak-hub/contracts validate

      - name: The generated types must match the contract
        run: |
          pnpm contracts:generate
          git diff --exit-code packages/contracts/generated

  diagrams:
    name: Docs · every Mermaid diagram parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @freak-hub/assets exec playwright install --with-deps chromium

      # A broken diagram renders as a grey error box on GitHub, which is worse
      # than no diagram at all: catch it here instead.
      - name: Parse the diagrams
        run: pnpm diagrams:check

  migrations:
    name: Migrations · apply against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: freakhub
          POSTGRES_PASSWORD: freakhub
          POSTGRES_DB: freakhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freakhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Up and back down again
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://freakhub:freakhub@localhost:5432/freakhub?sslmode=disable
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate status
          go run ./cmd/migrate down

      # These tests roll every migration back to zero, so they refuse to run
      # against anything but a database whose name ends in _test — otherwise a
      # developer following the skip message would drop their own data. Hence a
      # second database here rather than reusing the one above.
      - name: A throwaway database for the data migrations
        env:
          PGPASSWORD: freakhub
        run: psql -h localhost -U freakhub -d freakhub -c 'CREATE DATABASE freakhub_test'

      # The backfill migration carries logic — lower(email), the IS NULL guard,
      # the self-link exclusion and the tiebreak between duplicate accepted
      # invitations — so it is exercised against this Postgres. The same tests
      # skip themselves in the `api` job, which has no database.
      - name: Data migrations behave against a real Postgres
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://freakhub:freakhub@localhost:5432/freakhub_test?sslmode=disable
        run: go test -count=1 ./db/...

  images:
    name: Images · both must build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Fabricate a placeholder Clerk key
        run: |
          host="ci-placeholder.clerk.accounts.dev$"
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_$(printf '%s' "$host" | base64 | tr -d '=')" >> "$GITHUB_ENV"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deliberately depends on nothing and nothing depends on it: `web`, `api` and
  # `contracts` are never held up by a browser run, let alone by a third party's
  # availability.
  #
  # Everything here is conditional on the instance secrets existing. That is not
  # a preference: without a secret key `clerkMiddleware` fails per request with
  # "Handshake token verification failed", which Next renders as an error page,
  # so even the signed-out perimeter has nothing to assert on. A fork's pull
  # request therefore reports this job skipped rather than broken.
  e2e:
    name: Web · E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      # The two invitation journeys are the reason this job exists: they cross
      # getToken -> Authorization -> JWKS -> Go -> Clerk's Backend API, which no
      # unit test can reach because all of it lives between systems. That needs
      # a real database behind a real API, so both run here.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: freakhub
          POSTGRES_PASSWORD: freakhub
          POSTGRES_DB: freakhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freakhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Non-secret settings only. The Clerk keys are attached to the individual
      # steps that need them instead, so they are not handed to `pnpm install`
      # or to a `playwright install --with-deps` that calls sudo apt.
      DATABASE_URL: postgres://freakhub:freakhub@localhost:5432/freakhub?sslmode=disable
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /entrar
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /registro
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /inicio
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /inicio
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # One address per run, so two pull requests cannot revoke each other's
      # pending invitation — the instance is shared and `concurrency` only
      # serialises a single ref. The run attempt is in there because a re-run
      # must not collide with what its previous attempt left behind.
      E2E_INVITEE_EMAIL: freak-hub-e2e-${{ github.run_id }}-${{ github.run_attempt }}+clerk_test@example.com
      # In CI an unreachable API is a failure, not a reason to skip: this job
      # starts it deliberately.
      E2E_REQUIRE_API: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - run: pnpm install --frozen-lockfile

      - name: Is there a Clerk instance to talk to?
        id: clerk
        env:
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_USER_IDENTIFIER: ${{ secrets.E2E_CLERK_USER_IDENTIFIER }}
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$E2E_CLERK_USER_IDENTIFIER" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Clerk instance secrets on this run; the E2E suite is skipped."
          fi

      - name: Install Chromium
        if: steps.clerk.outputs.available == 'true'
        run: pnpm --filter @freak-hub/web exec playwright install --with-deps chromium

      # The test user must already exist as a member, or every invitation is
      # answered with "your account is still pending". The webhook that would
      # create it is not wired here, so the row is written directly — and the
      # user id is resolved from Clerk rather than stored as a fifth secret.
      - name: Seed the test user as a member
        if: steps.clerk.outputs.available == 'true'
        working-directory: apps/api
        shell: bash
        env:
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_USER_IDENTIFIER: ${{ secrets.E2E_CLERK_USER_IDENTIFIER }}
        run: |
          set -euo pipefail
          go run ./cmd/migrate up
          # The key goes in on stdin: an -H argument is visible in /proc/*/cmdline.
          user=$(curl -fsS -G "https://api.clerk.com/v1/users" \
            --data-urlencode "email_address=$E2E_CLERK_USER_IDENTIFIER" \
            -H @- <<<"Authorization: Bearer $CLERK_SECRET_KEY")
          uid=$(jq -r '.[0].id // empty' <<<"$user")
          uname=$(jq -r '.[0].username // empty' <<<"$user")
          if [ -z "$uid" ]; then
            echo "::error::No user in the Clerk instance for E2E_CLERK_USER_IDENTIFIER."
            exit 1
          fi
          # Without this the literal string "null" lands in members.username and
          # a journey happily asserts on "@null".
          if [ -z "$uname" ]; then
            echo "::error::The E2E test user has no username; /inicio shows it and a journey asserts on it."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v uid="$uid" -v uname="$uname" -v mail="$E2E_CLERK_USER_IDENTIFIER" <<'SQL'
          INSERT INTO members (clerk_user_id, username, display_name, email)
          VALUES (:'uid', :'uname', :'uname', :'mail')
          ON CONFLICT (clerk_user_id) DO NOTHING;
          SQL

      # API_ALLOWED_ORIGINS is not decoration: its first entry becomes the
      # `authorizedParty` the JWT is checked against, so a mismatch here is one
      # of the five boundary failures these tests exist to catch.
      - name: Start the API
        if: steps.clerk.outputs.available == 'true'
        working-directory: apps/api
        shell: bash
        env:
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          API_ALLOWED_ORIGINS: http://localhost:3000
          API_PORT: "8080"
        run: |
          set -euo pipefail
          # The config refuses to boot without a webhook secret and svix
          # base64-decodes it, so a plain sentinel raises "illegal base64 data".
          # Fabricated rather than written literally, like the placeholder Clerk
          # key in the `web` job: no webhook is delivered here, and a
          # high-entropy string in the repository is indistinguishable from a
          # real leak.
          secret=$(printf '%s' 'ci-e2e-no-webhooks-in-this-job' | base64 | tr -d '=\n')
          CLERK_WEBHOOK_SIGNING_SECRET="whsec_$secret" go run ./cmd/api &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz

      # The perimeter needs no test user and no API. Its failure is a real
      # failure: a protected route stopped redirecting.
      - name: Signed-out perimeter
        if: steps.clerk.outputs.available == 'true'
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: pnpm --filter @freak-hub/web exec playwright test --project=signed-out

      # Tied to a live Clerk instance, so an outage there would report itself
      # here as a regression that is not ours. Advisory on purpose.
      - name: Signed-in journeys
        if: steps.clerk.outputs.available == 'true'
        continue-on-error: true
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CLERK_USER_IDENTIFIER: ${{ secrets.E2E_CLERK_USER_IDENTIFIER }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: pnpm --filter @freak-hub/web exec playwright test --project=signed-in

      # Two halves. This run's own address is revoked by name, so a concurrent
      # pull request's pending invitation is never touched. The prefix sweep
      # then collects orphans — a cancelled run never reaches this step, and
      # `cancel-in-progress` is on — but only ones old enough that no live run
      # could still be using them.
      - name: Revoke the invitations this run created
        if: ${{ !cancelled() && steps.clerk.outputs.available == 'true' }}
        shell: bash
        env:
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          auth=$(mktemp)
          ids=$(mktemp)
          trap 'rm -f "$auth" "$ids"' EXIT
          printf 'Authorization: Bearer %s\n' "$CLERK_SECRET_KEY" > "$auth"

          # Two hours: longer than any plausible run, short enough to stay tidy.
          cutoff=$(( ($(date +%s) - 7200) * 1000 ))
          offset=0
          while :; do
            page=$(curl -fsS -G "https://api.clerk.com/v1/invitations" \
              --data-urlencode "status=pending" \
              --data-urlencode "limit=100" \
              --data-urlencode "offset=$offset" \
              -H @"$auth")
            jq -r --arg mine "$E2E_INVITEE_EMAIL" --argjson cutoff "$cutoff" '
              .[]
              | select(.email_address | startswith("freak-hub-e2e-"))
              | select(.email_address == $mine or .created_at < $cutoff)
              | .id' <<<"$page" >> "$ids"
            count=$(jq 'length' <<<"$page")
            if [ "$count" -lt 100 ]; then
              break
            fi
            offset=$(( offset + 100 ))
          done

          # A revoke that fails warns instead of failing the job: this is
          # cleanup, and the listing above is the part that must be loud.
          while read -r id; do
            if [ -z "$id" ]; then
              continue
            fi
            if curl -fsS -X POST "https://api.clerk.com/v1/invitations/$id/revoke" \
              -H @"$auth" > /dev/null; then
              echo "revoked $id"
            else
              echo "::warning::Could not revoke $id"
            fi
          done < "$ids"

      # The HTML report. Safe to publish only because the `setup` project
      # records no trace (see playwright.config.ts): the HTML reporter copies
      # attachments into the report directory, so a trace would ride along into
      # a public artifact regardless of `test-results/` being left out.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.clerk.outputs.available == 'true' }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  secrets:
    name: Secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
