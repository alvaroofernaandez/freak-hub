# Freak Hub — local stack and VPS deployment.
#
# Local:  docker compose up -d postgres minio   (run web and api from source)
# VPS:    docker compose --profile apps up -d   (everything in containers)

name: freak-hub

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freakhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-freakhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freakhub} -d ${POSTGRES_DB:-freakhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-freakhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Creates the media bucket once and exits. Re-running compose is harmless.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-freakhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-freakhub-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'bucket ready'
      "
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_ENV: ${API_ENV:-production}
      API_PORT: 8080
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:?set API_ALLOWED_ORIGINS in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-freakhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freakhub}?sslmode=disable
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET in .env}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-freakhub-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-freakhub}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${API_PORT:-8080}:8080"

  # Runs the migrations and exits. Start it before `api` on a fresh database.
  migrate:
    profiles: ["apps"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-freakhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freakhub}?sslmode=disable
    restart: "no"

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set it in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
